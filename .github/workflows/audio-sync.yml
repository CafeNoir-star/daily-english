name: audio-sync

on:
  schedule:
    # 每天 04:00 Asia/Shanghai（UTC 20:00）
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "保持未来多少天的语料缓冲"
        required: false
        default: "30"
      force_audio:
        description: "强制重新生成全部音频"
        type: boolean
        default: false
      stale_days:
        description: "未来语料至少提前多少天（不足则告警）"
        required: false
        default: "2"
      corpus_source:
        description: "语料来源：feeds=真实 RSS 摘录（默认），llm=模型生成"
        required: false
        default: "feeds"
      refresh_corpus:
        description: "覆盖历史语料（重做窗口内最旧的一批，每次至多 14 天）"
        type: boolean
        default: false
      max_days:
        description: "本次最多处理多少天（覆盖模式可先填 1 做小样验证）"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: audio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # 不依赖触发时的 SHA（手动 Run 时可能指向旧提交），始终基于最新 main
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 抓取前先确认真实源可达。不通也不中断——Generate corpus 会自己逐源降级，
      # 这里只是把"到底是网络问题还是内容全被过滤"提前区分开，便于排障。
      - name: Probe RSS reachability
        id: probe
        continue-on-error: true
        run: |
          for u in \
            https://www.theguardian.com/uk/business/rss \
            https://www.theguardian.com/uk/technology/rss \
            https://feeds.bbci.co.uk/news/business/rss.xml
          do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 \
              -A 'DailyEnglishLearningBot/1.0 (personal study; low volume)' "$u" 2>/dev/null || echo ERR)
            echo "$u -> $code"
          done

      # 第一步：从公开 RSS 摘录真实英文段落并写入云库（消耗 WorkBuddy 积分做翻译标注）
      # 需要 WB_EMAIL / WB_PASSWORD；未配置时自动跳过，只做音频同步。
      - name: Generate corpus
        id: corpus
        continue-on-error: true
        env:
          WB_ENDPOINT: ${{ vars.WB_ENDPOINT || 'https://daily-english-38358.app.workbuddy.host' }}
          WB_KEY: ${{ secrets.WB_KEY }}
          WB_EMAIL: ${{ secrets.WB_EMAIL }}
          WB_PASSWORD: ${{ secrets.WB_PASSWORD }}
          # 日常只缺 1 天，用不到这个上限；覆盖历史时靠它一次跑完 30 天
          MAX_DAYS_PER_RUN: ${{ github.event.inputs.max_days || '30' }}
        run: |
          # 只输出长度，不输出值；用于判断 Secret 是否真的注入
          echo "WB_KEY len=${#WB_KEY} | WB_EMAIL len=${#WB_EMAIL} | WB_PASSWORD len=${#WB_PASSWORD}"
          if [ -z "$WB_EMAIL" ] || [ -z "$WB_PASSWORD" ]; then
            echo "::warning::未配置 WB_EMAIL / WB_PASSWORD，跳过语料生成（仅同步音频）"
            echo "::warning::请检查 Settings → Secrets and variables → Actions → Repository secrets 中是否存在这两个名字"
            exit 0
          fi
          python pipeline.py \
            --with-corpus \
            --days "${{ github.event.inputs.days || '30' }}" \
            --corpus-source "${{ github.event.inputs.corpus_source || 'feeds' }}" \
            ${{ github.event.inputs.refresh_corpus == 'true' && '--refresh-corpus' || '' }} \
            --no-audio \
            --fail-if-stale 0

      # 第二步：消费待补词队列，用 WorkBuddy LLM 补释义写入公共词库
      # 必须放在音频同步之前，这样新增的词能同一次生成读音
      - name: Enrich pending words
        id: enrich
        continue-on-error: true
        env:
          WB_ENDPOINT: ${{ vars.WB_ENDPOINT || 'https://daily-english-38358.app.workbuddy.host' }}
          WB_KEY: ${{ secrets.WB_KEY }}
          WB_EMAIL: ${{ secrets.WB_EMAIL }}
          WB_PASSWORD: ${{ secrets.WB_PASSWORD }}
        run: |
          if [ -z "$WB_EMAIL" ] || [ -z "$WB_PASSWORD" ]; then
            echo "::warning::未配置 WB_EMAIL / WB_PASSWORD，跳过待补词补齐"
            exit 0
          fi
          python pipeline.py --enrich-pending

      # 第二步：匿名读语料，补齐缺失音频（不需要密码）
      - name: Sync audio
        id: sync
        continue-on-error: true
        env:
          WB_ENDPOINT: ${{ vars.WB_ENDPOINT || 'https://daily-english-38358.app.workbuddy.host' }}
          WB_KEY: ${{ secrets.WB_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force_audio }}" = "true" ]; then
            EXTRA="--force-audio"
          fi
          python pipeline.py --fail-if-stale "${{ github.event.inputs.stale_days || '2' }}" $EXTRA

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "没有音频变更"
            exit 0
          fi
          git commit -m "chore(audio): $(date -u +%F) 音频同步"

          # 远端可能在本 job 运行期间前进（其它 run 或人工推送），
          # 先 rebase 再推；audio/manifest.json 冲突时以本次生成的为准。
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，清理后重试"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::连续 3 次推送失败，请检查分支保护规则或并发运行"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### 每日同步"
            echo ""
            echo "- 源可达性探测：${{ steps.probe.outcome }}"
            echo "- 语料来源：${{ github.event.inputs.corpus_source || 'feeds' }}（feeds=真实 RSS 摘录）"
            echo "- 语料生成：${{ steps.corpus.outcome }}"
            echo "- 待补词补齐：${{ steps.enrich.outcome }}"
            echo "- 音频同步：${{ steps.sync.outcome }}"
            echo "- 音频文件数：$(find audio -name '*.mp3' 2>/dev/null | wc -l)"
            echo "- 音频总体积：$(du -sh audio 2>/dev/null | cut -f1)"
            echo "- 最近提交：$(git log -1 --pretty=format:'%h %s')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when corpus is stale
        if: steps.sync.outcome == 'failure' || steps.corpus.outcome == 'failure'
        run: |
          echo "::error::语料生成或音频同步失败，请检查上方日志与 Secrets 配置"
          exit 1
