<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>每日英语学习</title>
<style>
:root, [data-theme="light"] {
  --bg-primary: #f2f5f9; --bg-secondary: #ffffff; --bg-card: #ffffff; --bg-card-hover: #f6f8fb;
  --bg-subtle: #f8fafc;
  --text-primary: #0f172a; --text-secondary: #64748b; --text-muted: #94a3b8;
  --accent-blue: #2563eb; --accent-blue-light: #3b82f6; --accent-blue-soft: rgba(37,99,235,0.1);
  --accent-green: #059669; --accent-red: #dc2626; --accent-orange: #d97706; --accent-purple: #7c3aed;
  --border-color: #e6eaf0; --border-strong: #d9e0ea;
  --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 10px 30px rgba(15,23,42,0.06);
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
  --radius: 16px; --radius-md: 12px; --radius-sm: 10px;
  --hover-overlay: rgba(37,99,235,0.08); --marked-bg: rgba(59,130,246,0.16); --highlight-bg: rgba(37,99,235,0.08);
}
[data-theme="dark"] {
  --bg-primary: #0b1120; --bg-secondary: #121a2b; --bg-card: #151f33; --bg-card-hover: #1c2740;
  --bg-subtle: #101828;
  --text-primary: #e7eefa; --text-secondary: #93a3bd; --text-muted: #6b7c96;
  --accent-blue: #3b82f6; --accent-blue-light: #60a5fa; --accent-blue-soft: rgba(59,130,246,0.16);
  --accent-green: #10b981; --accent-red: #ef4444; --accent-orange: #f59e0b; --accent-purple: #8b5cf6;
  --border-color: #243049; --border-strong: #2f3d5a;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --hover-overlay: rgba(59,130,246,0.18); --marked-bg: rgba(59,130,246,0.24); --highlight-bg: rgba(59,130,246,0.14);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-gutter: stable; overflow-y: scroll; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary); color: var(--text-primary); min-height: 100vh;
  line-height: 1.65; transition: background 0.3s, color 0.3s; font-size: 15px;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
::selection { background: rgba(37,99,235,0.18); }
:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; border-radius: 4px; }

/* Auth */
.auth-overlay { position: fixed; inset: 0; background: radial-gradient(1200px 600px at 50% -10%, rgba(37,99,235,0.08), transparent 60%), var(--bg-primary); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { background: var(--bg-card); border-radius: var(--radius); padding: 36px 32px; max-width: 400px; width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
.auth-title { font-size: 23px; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--accent-blue); letter-spacing: -0.2px; }
.auth-subtitle { font-size: 13.5px; color: var(--text-secondary); text-align: center; margin-bottom: 26px; }
.auth-tabs { display: flex; gap: 4px; margin-bottom: 22px; background: var(--bg-subtle); border-radius: var(--radius-md); padding: 4px; }
.auth-tab { flex: 1; padding: 9px; text-align: center; font-size: 14px; cursor: pointer; border: none; background: transparent; color: var(--text-secondary); font-family: inherit; transition: all 0.2s; border-radius: var(--radius-sm); }
.auth-tab.active { background: var(--bg-card); color: var(--accent-blue); font-weight: 600; box-shadow: var(--shadow-sm); }
.auth-field { margin-bottom: 16px; }
.auth-label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 7px; font-weight: 500; }
.auth-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-primary); font-size: 15px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
.auth-input::placeholder { color: var(--text-muted); }
.auth-input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px var(--accent-blue-soft); }
.auth-error { color: var(--accent-red); font-size: 13px; margin-top: 8px; min-height: 18px; }
.auth-btn { width: 100%; padding: 13px; font-size: 15px; }

/* Navbar */
.navbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
.nav-logo { font-size: 17px; font-weight: 700; color: var(--accent-blue); white-space: nowrap; letter-spacing: 0.2px; }
.nav-tabs { display: flex; gap: 4px; margin-left: 10px; }
.nav-tab { padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; color: var(--text-secondary); transition: all 0.18s; border: none; background: transparent; font-family: inherit; white-space: nowrap; }
.nav-tab:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.nav-tab.active { background: var(--accent-blue-soft); color: var(--accent-blue); font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 8px; }
.streak-badge, .timer-badge { display: flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border-color); background: transparent; font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }
.timer-badge { color: var(--accent-blue); border-color: rgba(37,99,235,0.22); background: var(--accent-blue-soft); }
.timer-badge #timerDisplay { font-variant-numeric: tabular-nums; font-weight: 600; }
.theme-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.theme-toggle:hover { border-color: var(--accent-blue); background: var(--accent-blue-soft); }
.user-badge { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border-color); font-size: 12.5px; color: var(--text-secondary); }
.logout-btn { background: transparent; border: 1px solid var(--border-color); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12px; color: var(--text-secondary); font-family: inherit; transition: all 0.2s; }
.logout-btn:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

/* Main */
.main-content { max-width: 880px; margin: 0 auto; padding: 26px 20px 84px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Cards */
.card { background: var(--bg-card); border-radius: var(--radius); padding: 26px; margin-bottom: 18px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
.card-title { font-size: 17px; font-weight: 700; letter-spacing: -0.1px; }
.card-meta { font-size: 12.5px; color: var(--text-muted); letter-spacing: 0.2px; }

/* Phase Steps */
.phase-steps { display: flex; gap: 8px; margin-bottom: 4px; overflow-x: auto; padding-bottom: 2px; }
.phase-step { flex: 1; min-width: 78px; padding: 10px 12px; text-align: center; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; transition: all 0.18s; border-radius: var(--radius-sm); background: var(--bg-subtle); border: 1px solid transparent; white-space: nowrap; }
.phase-step:hover { background: var(--bg-card-hover); }
.phase-step.active { color: var(--accent-blue); background: var(--accent-blue-soft); border-color: rgba(37,99,235,0.26); font-weight: 600; }
.phase-step.completed { color: var(--text-primary); opacity: 0.62; }
.phase-step.completed::after { content: ' \2713'; color: var(--accent-green); opacity: 1; font-weight: 700; }
.phase-step .step-num { font-size: 10.5px; letter-spacing: 0.7px; opacity: 0.62; font-weight: 600; margin-bottom: 1px; }

/* Sentence - unified for all phases */
.sentence-block { background: var(--bg-subtle); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 10px; border: 1px solid transparent; transition: border-color 0.2s; }
.sentence-block:hover { border-color: var(--border-color); }
.sentence-en { font-size: 18px; line-height: 2; margin-bottom: 10px; letter-spacing: 0.1px; }
.sentence-en .word { cursor: pointer; padding: 1px 3px; border-radius: 5px; transition: background 0.15s; }
.sentence-en .word:hover { background: var(--hover-overlay); }
.sentence-en .word.marked { background: var(--marked-bg); color: var(--accent-blue); font-weight: 600; }
.sentence-zh { font-size: 14.5px; color: var(--text-secondary); line-height: 1.7; }
.sentence-actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn-icon { background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 7px 15px; cursor: pointer; font-size: 13px; color: var(--text-secondary); transition: all 0.18s; font-family: inherit; }
.btn-icon:hover { background: var(--accent-blue-soft); color: var(--accent-blue); border-color: rgba(37,99,235,0.3); }
.btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }

/* Buttons */
.btn { padding: 12px 24px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 14.5px; font-weight: 600; transition: all 0.18s; font-family: inherit; letter-spacing: 0.1px; }
.btn-primary { background: var(--accent-blue); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.24); }
.btn-primary:hover { background: var(--accent-blue-light); box-shadow: 0 4px 14px rgba(37,99,235,0.3); }
.btn-primary:disabled { background: var(--text-muted); box-shadow: none; cursor: not-allowed; }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
.btn-success { background: var(--accent-blue); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.24); }
.btn-success:hover { background: var(--accent-blue-light); box-shadow: 0 4px 14px rgba(37,99,235,0.3); }
.btn-success:disabled { background: var(--text-muted); box-shadow: none; cursor: not-allowed; }
.btn-danger { background: var(--accent-red); color: #fff; }
.btn-danger-sm { background: transparent; border: 1px solid rgba(220,38,38,0.35); color: var(--accent-red); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.18s; }
.btn-danger-sm:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

/* Unified phase action bar (bottom buttons) */
.phase-actions { text-align: center; margin-top: 26px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

/* Blind Listen - unified with other phases */
.blind-listen-box { text-align: center; padding: 22px 0 6px; }
.blind-listen-instruction { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.85; }
.listen-controls { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.speed-control { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); }
.speed-control select { background: var(--bg-subtle); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 7px 10px; font-size: 14px; font-family: inherit; }

/* Vocab Learning - unified padding with sentence-block */
.vocab-learning-card { background: var(--bg-subtle); border-radius: var(--radius-md); padding: 20px; margin-bottom: 12px; border: 1px solid var(--border-color); }
.vocab-learning-word { font-size: 23px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
.vocab-learning-phonetic { font-size: 13.5px; color: var(--text-muted); font-family: 'SF Mono', Consolas, monospace; margin-left: 8px; }
.vocab-learning-def { font-size: 15px; margin-top: 12px; color: var(--text-primary); }
.vocab-learning-example { font-size: 13.5px; color: var(--text-secondary); font-style: italic; margin-top: 10px; border-left: 3px solid var(--border-strong); padding-left: 11px; }
.vocab-learning-tips { background: var(--bg-card); padding: 14px 16px; border-radius: var(--radius-sm); margin-top: 12px; font-size: 13.5px; border: 1px solid var(--border-color); }
.vocab-learning-tips .tip-label { font-weight: 700; color: var(--text-primary); }
.vocab-learning-tips .tip-row { margin-bottom: 6px; }
.vocab-card-actions { display: flex; gap: 8px; margin-top: 12px; }

/* Read Along - unified padding with sentence-block */
.read-along-sentence { padding: 18px 20px; margin-bottom: 10px; border-radius: var(--radius-md); background: var(--bg-subtle); border: 1px solid transparent; transition: all 0.25s; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.read-along-sentence.highlight { background: var(--highlight-bg); border-color: rgba(37,99,235,0.28); }
.read-along-sentence .en { font-size: 17px; }
.read-along-sentence .zh { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

/* Dictation - unified padding */
.dictation-input { width: 100%; min-height: 84px; padding: 16px 18px; background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 16px; line-height: 1.8; resize: vertical; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
.dictation-input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px var(--accent-blue-soft); }
.dictation-result { margin-top: 14px; padding: 18px; background: var(--bg-subtle); border-radius: var(--radius-md); border: 1px solid var(--border-color); }
.comparison-line { padding: 12px 14px; margin-bottom: 8px; border-radius: var(--radius-sm); line-height: 2; font-size: 16px; }
.word-correct { color: var(--accent-green); }
.word-wrong { color: var(--accent-red); text-decoration: underline wavy var(--accent-red); }
.word-missing { color: var(--accent-orange); background: var(--marked-bg); padding: 0 4px; border-radius: 3px; }
.word-extra { color: var(--accent-purple); text-decoration: line-through; }
.error-summary { margin-top: 12px; }
.error-tag { display: inline-block; padding: 3px 12px; margin: 3px; border-radius: 999px; font-size: 12.5px; }
.error-tag.spelling { background: rgba(220,38,38,0.1); color: var(--accent-red); }
.error-tag.article { background: rgba(124,58,237,0.1); color: var(--accent-purple); }

/* Stats */
.review-summary { text-align: center; padding: 0; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
.stat-item { background: var(--bg-subtle); padding: 20px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
.stat-value { font-size: 27px; font-weight: 700; color: var(--accent-blue); letter-spacing: -0.5px; }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* Vocab List */
.vocab-item { background: var(--bg-subtle); border-radius: var(--radius-md); padding: 20px; margin-bottom: 10px; border: 1px solid var(--border-color); }
.vocab-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.vocab-word { font-size: 21px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; letter-spacing: -0.2px; }
.vocab-phonetic { font-size: 13px; color: var(--text-muted); font-family: 'SF Mono', Consolas, monospace; font-weight: 400; }
.vocab-pos { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: var(--accent-blue-soft); color: var(--accent-blue); font-weight: 600; }
.vocab-status { font-size: 11.5px; padding: 3px 11px; border-radius: 999px; font-weight: 600; }
.vocab-status.new { background: rgba(220,38,38,0.1); color: var(--accent-red); }
.vocab-status.learning { background: rgba(217,119,6,0.1); color: var(--accent-orange); }
.vocab-status.mastered { background: rgba(5,150,105,0.1); color: var(--accent-green); }
.vocab-status.permanent { background: rgba(124,58,237,0.1); color: var(--accent-purple); }
.vocab-body { font-size: 13.5px; color: var(--text-secondary); }
.vocab-body .definition { margin-bottom: 8px; color: var(--text-primary); font-size: 15px; }
.vocab-body .example { font-style: italic; margin-bottom: 8px; font-size: 13.5px; }
.vocab-tips { background: var(--bg-card); padding: 14px 16px; border-radius: var(--radius-sm); margin-top: 12px; border: 1px solid var(--border-color); }
.vocab-tips .tip-row { margin-bottom: 6px; font-size: 13.5px; }
.vocab-tips .tip-label { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }

/* Review */
.review-card { text-align: center; padding: 24px 0 8px; }
.review-card .word-display { font-size: 36px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.8px; }
.review-card .phonetic-display { font-size: 16px; color: var(--text-muted); margin-bottom: 16px; font-family: 'SF Mono', Consolas, monospace; }
.review-card .reveal-area { min-height: 84px; padding: 22px; background: var(--bg-subtle); border-radius: var(--radius-md); margin: 20px 0; border: 1px solid var(--border-color); }
.review-card .definition-display { font-size: 17px; color: var(--text-primary); }
.review-card .example-display { font-size: 13.5px; color: var(--text-secondary); margin-top: 10px; font-style: italic; }
.review-buttons { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
.review-btn { padding: 12px 28px; font-size: 14.5px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-family: inherit; font-weight: 600; transition: all 0.18s; }
.review-btn.forgot { background: var(--accent-red); color: #fff; }
.review-btn.fuzzy { background: var(--accent-orange); color: #fff; }
.review-btn.remembered { background: var(--accent-green); color: #fff; }
.review-progress { display: flex; justify-content: center; gap: 5px; margin-bottom: 18px; flex-wrap: wrap; }
.review-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
.review-dot.done { background: var(--accent-green); }
.review-dot.current { background: var(--accent-blue); box-shadow: 0 0 0 3px var(--accent-blue-soft); }

/* Dashboard */
.dashboard-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.dash-stat { background: var(--bg-card); padding: 20px 16px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
.dash-stat .value { font-size: 27px; font-weight: 700; color: var(--accent-blue); letter-spacing: -0.5px; }
.dash-stat .label { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 12px; }
.calendar-day { display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 13px; padding: 7px 0; background: var(--bg-subtle); color: var(--text-primary); font-weight: 500; }
.calendar-day.other-month { opacity: 0.15; color: var(--text-muted); font-weight: 400; }
.calendar-day.studied { background: rgba(5,150,105,0.13); color: #047857; font-weight: 700; }
.calendar-day.today { border: 2px solid var(--accent-blue); font-weight: 700; }
.calendar-day-header { text-align: center; font-size: 11.5px; color: var(--text-muted); padding: 2px 0; font-weight: 600; }
.simple-chart { display: flex; align-items: flex-end; justify-content: space-around; gap: 8px; height: 120px; padding: 10px 0; }
.chart-bar { flex: 1; max-width: 72px; background: var(--accent-blue); border-radius: 6px 6px 0 0; min-height: 2px; position: relative; transition: height 0.3s; opacity: 0.88; }
.chart-bar .bar-label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.chart-bar .bar-value { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-secondary); }

/* Misc */
[data-theme="dark"] .nav-logo,
[data-theme="dark"] .auth-title { color: var(--accent-blue-light); }
[data-theme="dark"] .calendar-day.studied { background: rgba(16,185,129,0.22); color: #6ee7b7; }
[data-theme="dark"] .dash-stat .value,
[data-theme="dark"] .stat-value { color: var(--accent-blue-light); }
.empty-state { text-align: center; padding: 52px 16px; color: var(--text-muted); }
.empty-state .icon { font-size: 38px; margin-bottom: 10px; opacity: 0.9; }
.empty-state .msg { font-size: 14.5px; }
.loading { text-align: center; padding: 44px; color: var(--text-muted); }
.spinner { border: 3px solid var(--border-color); border-top: 3px solid var(--accent-blue); border-radius: 50%; width: 30px; height: 30px; animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--bg-card); color: var(--text-primary); padding: 12px 22px; border-radius: var(--radius-md); box-shadow: var(--shadow); z-index: 1000; font-size: 13.5px; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; border: 1px solid var(--border-color); max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }

/* Mobile */
@media (max-width: 640px) {
  .navbar { padding: 0 12px; height: auto; flex-wrap: wrap; gap: 6px; padding-top: 9px; padding-bottom: 9px; }
  .nav-logo { font-size: 16px; order: 1; }
  .nav-right { order: 2; gap: 6px; }
  .nav-tabs { order: 3; width: 100%; justify-content: space-around; margin-top: 6px; margin-left: 0; }
